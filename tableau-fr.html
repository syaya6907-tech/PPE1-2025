<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau des résultats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title">Tableau des résultats</h1>
            <table class="table is-striped is-fullwidth">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Score</th>
                        <th>Commentaire</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Exemple 1</td>
                        <td>95</td>
                        <td>Très bien</td>
                    </tr>
                    <tr>
                        <td>Exemple 2</td>
                        <td>87</td>
                        <td>Bien</td>
                    </tr>
                    <tr>
                        <td>Exemple 3</td>
                        <td>78</td>
                        <td>Correct</td>
                    </tr>
                </tbody>
            </table>
            <a class="button is-link" href="index.html">Retour à l'accueil</a>
        </div>
    </section>
</body>
</html>
